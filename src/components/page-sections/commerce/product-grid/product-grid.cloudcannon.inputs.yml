eyebrow:
  type: text
  comment: Optional eyebrow text shown above the heading.
heading:
  type: text
  comment: Main heading for the collection.
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: false
    numberedlist: false
collectionId:
  type: select
  label: Collection
  comment: Show every product in this collection, in catalogue order. Products live in the Products data file.
  options:
    values: _select_data.productCollections
featuredOnly:
  type: switch
  comment: Show only products marked as featured in the Products data file. Ignored when a collection is chosen.
productIds:
  type: array
  label: Specific products
  comment: Hand-pick products by id, in the order you want them. Overrides the collection and featured settings.
productIds[*]:
  type: select
  comment: Which product to show.
  options:
    values: _select_data.productIds
limit:
  type: number
  comment: Most products to show. Leave at 0 to show all of them.
randomize:
  type: switch
  label: Rotate on each visit
  comment: Show a random handful from the selection, reshuffled every time the page loads. Set a limit for this to do anything.
enquiryEmail:
  type: email
  comment: Enquiries open the visitor's mail app addressed here, with the product name as the subject. Leave empty to hide the enquiry links.
enquiryText:
  type: text
  comment: Wording for the enquiry link on each card.
showPhotoGallery:
  type: switch
  label: Photo sets on cards
  comment: When a product has more than one photo, let visitors click through them on the card. Turn off to show only the first photo.
footnote:
  type: markdown
  comment: Optional small print below the grid, for shipping or turnaround notes.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    bulletedlist: false
    numberedlist: false
alignmentHorizontal:
  type: select
  comment: Alignment for the heading and supporting text.
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
gap:
  type: select
  comment: Spacing between product cards.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
minItemWidth:
  type: number
  comment: Minimum width for each product card in pixels.
maxItemWidth:
  type: number
  comment: Maximum width for each product card in pixels.
buttonSections:
  type: array
  label: Buttons
  comment: Optional buttons shown below the grid.
  options:
    structures: _structures.buttonSections
products:
  type: array
  label: One-off products
  comment: Products written out here instead of coming from the Products data file. Overrides every setting above. Leave empty unless you need a one-off that does not belong in the catalogue.
  options:
    structures: _structures.productGridItems
